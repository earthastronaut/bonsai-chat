# Railway deployment for Open WebUI
# Deploy: Connect this repo to Railway and it will auto-deploy

[build]
# Railway automatically uses Dockerfile at root, which uses ghcr.io/open-webui/open-webui:main

[deploy]
# Container listens on port 8080
startCommand = ""
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway will set PORT automatically, Open WebUI uses 8080
# 
# Note: Environment variables for Whisper are configured in nixpacks.toml
